<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gatito interactivo para TikTok LIVE</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:transparent; }
  body { cursor: none; font-family: system-ui, sans-serif; }
  #stage { position:fixed; inset:0; pointer-events:none; }
  #cat {
    position:absolute; left:50%; top:50%; width:180px; height:170px;
    transform:translate(-50%,-50%); transform-origin:50% 70%;
    transition: left .16s ease-out, top .16s ease-out;
    filter: drop-shadow(0 8px 8px rgba(0,0,0,.22));
  }
  .cat-art { width:100%; height:100%; overflow:visible; }
  #cat.pounce { animation: pounce .42s ease-in-out; }
  #cat.blink .eye { transform:scaleY(.12); }
  .eye { transform-box:fill-box; transform-origin:center; transition:transform .12s; }
  #cat .tail { transform-origin: 142px 125px; animation: tail 1.1s ease-in-out infinite; }
  #cat .ear { animation: ear 2.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center bottom; }
  #cat .ear.right { animation-delay:.25s; }
  #cat .paw { transform-box:fill-box; transform-origin:center; }
  #cat.reach .paw.front { animation: reach .4s ease-in-out 2; }
  #cat.sleepy { animation: sleepy 2.5s ease-in-out; }
  @keyframes tail { 0%,100%{ transform:rotate(0) } 50%{ transform:rotate(14deg) } }
  @keyframes ear { 0%,90%,100%{transform:rotate(0)} 94%{transform:rotate(-12deg)} }
  @keyframes pounce { 0%,100%{transform:translate(-50%,-50%) scale(1)} 45%{transform:translate(-50%,-62%) scale(1.12)} }
  @keyframes reach { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-38deg) translateY(-8px)} }
  @keyframes sleepy { 0%,100%{transform:translate(-50%,-50%)} 50%{transform:translate(-50%,-46%) rotate(5deg)} }
  #hint {
    position:fixed; left:18px; bottom:18px; color:#fff; font-size:14px;
    padding:8px 12px; border-radius:12px; background:rgba(20,20,25,.55);
    text-shadow:0 1px 2px #000; pointer-events:none;
  }
  body.hide-hint #hint { display:none; }
</style>
</head>
<body>
<div id="stage">
  <div id="cat" aria-label="Gatito animado">
    <svg class="cat-art" viewBox="0 0 180 170" xmlns="http://www.w3.org/2000/svg">
      <!-- cola -->
      <path class="tail" d="M135 125 C164 125 171 102 157 91 C149 84 141 91 145 98"
        fill="none" stroke="#858b93" stroke-width="15" stroke-linecap="round"/>
      <!-- cuerpo -->
      <ellipse cx="91" cy="126" rx="53" ry="34" fill="#9ba1a9"/>
      <ellipse cx="83" cy="132" rx="30" ry="23" fill="#d9dde2"/>
      <!-- patas traseras -->
      <ellipse cx="55" cy="148" rx="23" ry="13" fill="#777e87"/>
      <ellipse cx="119" cy="148" rx="23" ry="13" fill="#777e87"/>
      <!-- orejas -->
      <path class="ear" d="M42 58 L36 12 Q38 4 46 12 L70 39Z" fill="#9ba1a9" stroke="#626a74" stroke-width="2"/>
      <path class="ear" d="M111 39 L137 12 Q145 7 147 17 L139 62Z" fill="#9ba1a9" stroke="#626a74" stroke-width="2"/>
      <path d="M45 43 L43 22 L59 42Z" fill="#c2a6ad"/>
      <path class="ear right" d="M120 40 L138 22 L135 47Z" fill="#c2a6ad"/>
      <!-- cabeza -->
      <ellipse cx="91" cy="68" rx="58" ry="49" fill="#aeb4bc" stroke="#626a74" stroke-width="2"/>
      <path d="M47 83 Q91 103 135 82 Q126 111 91 113 Q57 108 47 83Z" fill="#e1e4e8"/>
      <!-- ojos -->
      <ellipse class="eye" cx="69" cy="67" rx="8" ry="11" fill="#22a65a"/>
      <ellipse class="eye" cx="111" cy="67" rx="8" ry="11" fill="#22a65a"/>
      <circle cx="72" cy="63" r="2.5" fill="white"/><circle cx="114" cy="63" r="2.5" fill="white"/>
      <!-- nariz y boca -->
      <path d="M86 81 Q91 76 96 81 Q91 87 86 81Z" fill="#e77788"/>
      <path d="M91 86 Q86 93 81 89 M91 86 Q96 93 101 89" fill="none" stroke="#75483a" stroke-width="2" stroke-linecap="round"/>
      <!-- bigotes -->
      <path d="M56 82 L27 77 M57 89 L25 91 M126 82 L154 77 M125 89 L157 91" stroke="#626a74" stroke-width="2" stroke-linecap="round"/>
      <!-- patas delanteras -->
      <ellipse class="paw front" cx="66" cy="133" rx="16" ry="21" fill="#aeb4bc"/>
      <ellipse class="paw front" cx="113" cy="133" rx="16" ry="21" fill="#aeb4bc"/>
      <path d="M57 145 Q66 149 75 145 M104 145 Q113 149 122 145" fill="none" stroke="#626a74" stroke-width="2"/>
    </svg>
  </div>
</div>
<div id="hint">🐾 El gatito sigue tu cursor · clic para jugar · H para ocultar este aviso</div>
<script>
(() => {
  const cat = document.getElementById('cat');
  let x = innerWidth * .5, y = innerHeight * .58;
  let targetX=x, targetY=y, lastMove=Date.now(), clickTimer;
  const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
  function move(e){
    targetX=clamp(e.clientX,90,innerWidth-90);
    targetY=clamp(e.clientY-70,85,innerHeight-85);
    lastMove=Date.now();
    cat.classList.remove('sleepy');
    // Gira ligeramente hacia el cursor
    cat.style.transform = `translate(-50%,-50%) scaleX(${e.clientX < x ? -1 : 1})`;
  }
  addEventListener('mousemove',move);
  addEventListener('touchmove',e=>{ if(e.touches[0]) move(e.touches[0]); },{passive:true});
  function animate(){
    x += (targetX-x)*.075; y += (targetY-y)*.075;
    cat.style.left=x+'px'; cat.style.top=y+'px';
    if(Date.now()-lastMove>9000 && !cat.classList.contains('sleepy')) cat.classList.add('sleepy');
    requestAnimationFrame(animate);
  }
  animate();
  addEventListener('click',()=>{
    cat.classList.remove('pounce','reach'); void cat.offsetWidth;
    cat.classList.add('pounce','reach');
    clearTimeout(clickTimer);
    clickTimer=setTimeout(()=>cat.classList.remove('pounce','reach'),900);
  });
  addEventListener('keydown',e=>{
    if(e.key.toLowerCase()==='h') document.body.classList.toggle('hide-hint');
    if(e.key===' ') { cat.classList.add('pounce'); setTimeout(()=>cat.classList.remove('pounce'),500); }
  });
  // Ojos siguen el cursor
  addEventListener('mousemove',e=>{
    const eyes=cat.querySelectorAll('.eye');
    const dx=(e.clientX-x)/innerWidth, dy=(e.clientY-y)/innerHeight;
    eyes.forEach(eye=>{eye.style.translate=`${dx*3}px ${dy*3}px`;});
  });
})();
</script>
</body>
</html>
